[env]
# Nothing secret here; this file is committed. Secrets live outside the checkout in
# ~/.sandboxed_devenv/secrets/: the rig key pair and, optionally, a Claude Code token
# that `new` folds into a backend's settings.
# The project venv, so pytest and the sandboxed-devenv command are on PATH in a shell
# with mise activated. uv creates it (`mise run sync`); mise must not, or the two can
# pick different interpreters and uv rebuilds the venv on every run.
_.python.venv = { path = ".venv", create = false }

[settings]
# The pipx backend runs through uv (pinned below) instead of a pipx install.
pipx.uvx = true

[tools]
# Pinned so Claude, humans and CI run the same versions. Tasks live in
# .mise/tasks/ as executable scripts; CI runs `mise run verify`, the one
# definition of what "verified" means.
shellcheck = "0.11.0"
ruff = "0.16.10"
actionlint = "1.7.12"
"pipx:yamllint" = "1.38.0"
# uv: the project venv (mise run sync), and the pipx backend above.
uv = "0.13.0"
# node: the Mermaid CLI check of the summary's diagrams (npx). Same pin as packetcount.
node = "24.19.0"
