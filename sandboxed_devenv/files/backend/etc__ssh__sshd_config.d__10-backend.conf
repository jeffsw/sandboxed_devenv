# sandboxed-devenv backend: copied to /etc/ssh/sshd_config.d/10-backend.conf
# Keys only, and no agent forwarding into the VM: the rig key is the one way in.
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowAgentForwarding no
# Gateway deploys and talks over SFTP: Ubuntu's default "Subsystem sftp" stays.
# Only the host key the control side minted into the seed and pinned: sshd never offers a key
# nobody knows (the image's first boot and Ubuntu's service leave RSA and ECDSA keys around,
# seen 8 November 2026).
HostKey /etc/ssh/ssh_host_ed25519_key
